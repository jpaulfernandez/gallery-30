# External tools the editor downloads on demand (workflow plan 16), never bundled. Compiled into the app
# (`commands/tools.rs`). Like crates/develop/models.toml, every download is pinned: url, bytes and sha256 of the file,
# plus the program inside it (`member`) and that program's own size and sha256, checked again after extraction.
# Permissive or LGPL licences only (no GPL builds: the app is not GPL).

[[tool]]
name = "ffmpeg"
title = "FFmpeg 6.0"
version = "6.0-ae-ffmpeg-1.2.0"
# Auto-Editor's static FFmpeg build, published on PyPI as `ae-ffmpeg`. Checked 2026-10-13: the package metadata and the
# wheel's LICENSE.txt say LGPL v3; the configure line inside the binary has --enable-version3 and
# --enable-videotoolbox, and no --enable-gpl, --enable-nonfree, libx264 or libx265. Slideshows encode H.264 with
# Apple's VideoToolbox (`h264_videotoolbox`). FFmpeg's source: https://ffmpeg.org/releases/ffmpeg-6.0.tar.xz
licence = "LGPL-3.0-or-later"
licence_url = "https://pypi.org/project/ae-ffmpeg/1.2.0/"
homepage = "https://github.com/WyattBlue/auto-editor"

