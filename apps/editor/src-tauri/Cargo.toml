[package]
name = "photobook-editor"
version = "0.1.0"
description = "Photobook editor"
edition = "2021"
rust-version = "1.89"

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows.
name = "photobook_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
# Develop copy and paste (workflow plan 10): the settings travel as text on the system clipboard.
tauri-plugin-clipboard-manager = "2"
# Dev logging: webview `info()` calls and Rust `log` macros go to stdout in debug builds.
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Step 1.2: folder scan, hashing, thumbnails and proxies.
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["sync", "time"] }
kamadak-exif = "0.6"
# 5.x: 6.x needs a newer rust-version than this crate declares.
fast_image_resize = "5.1"
# Builds libjpeg-turbo from source with cmake (static, so the app bundle has no Homebrew dylib).
turbojpeg = { version = "1.5", default-features = false, features = ["cmake", "image", "require-simd"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Develop module (docs/design/archive/DEVELOP_PLAN.md): the render pipeline behind commands/develop.rs.
# D2.3: Auto level falls back to macOS Vision's horizon request on line-poor photos.
photobook-develop = { path = "../../../crates/develop", features = ["vision-horizon"] }
# Workflow plan 04: Delete project moves the project to the system Trash (never a permanent delete).
trash = "5"
# Workflow plan 32: AI captions talk to the Anthropic Messages API from Rust (the key never reaches the webview).
# Async client on Tauri's tokio runtime, rustls like the model downloader; `time` for the retry backoff.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
base64 = "0.22"
# Workflow plan 16: the pinned tools manifest (tools.toml, compiled in), parsed like crates/develop/models.toml.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Workflow plan 16: free disk space before a slideshow renders its frames (`statvfs`).
libc = "0.2"

# Plan 46: the haptic tick (src/commands/haptic.rs) on NSHapticFeedbackManager; macOS only, editor crate only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSHapticFeedback"] }

[dev-dependencies]
tempfile = "3"
# Workflow plan 32: a mocked Messages API for the AI request shape, refusal and structured output tests.
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Dev profile opt-levels live in the workspace manifest at the repo root (Cargo ignores profiles here).
