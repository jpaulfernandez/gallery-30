# SAM 2.1 prompt encoder + mask decoder (fp32: the fp16 decoder is only 10 MB smaller). Prompts are dynamic.
# IO: `input_points` f32 [b,1,n,2] (pixels in the 1024 frame; pad value -10), `input_labels` i64 [b,1,n]
# (1 foreground, 0 background, -1 padding), `input_boxes` f32 [b,nb,4] (x0,y0,x1,y1 in the 1024 frame), and the
# three encoder embeddings -> `iou_scores` [b,n,3], `pred_masks` [b,n,3,256,256] logits, `object_score_logits` [b,n,1].
