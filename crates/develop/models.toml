# Pinned model manifest (D4.2, docs/design/archive/DEVELOP_PLAN.md 4.8-4.10). Compiled into the crate (`ai::registry`).
#
# Every model is a list of files downloaded into `<appdata>/models/<name>/<version>/<file>` and checked against the
# SHA-256 here. The first file is the ONNX graph a session loads; the others are its external data files, which must
# sit next to it under the exact name the graph references.
#
# - URLs pin a Hugging Face commit (`resolve/<sha>/...`), so a pinned file can never change under us.
# - `bytes` and `sha256` come from the Hub's tree API (`/api/models/<repo>/tree/<sha>`; `lfs.oid` is the SHA-256 of
#   the file). They were looked up on 2026-10-10, not by hashing a download, except where a comment says otherwise.
# - `verified = false` marks an entry whose hash is not pinned yet; it is listed but cannot be downloaded.
# - `input` is the static NCHW shape we feed. `dims` overrides the graph's symbolic dimensions (ONNX `dim_param`
#   names) so CoreML sees static shapes; `static_input = false` keeps a model's inputs dynamic (prompted decoders).
# - Only permissive licences (plan section 2, "Model licences").
#
# Bump `version` whenever a file changes: the version is part of the install path, of the CoreML cache path and of
# the AI mask cache key, so old masks get regenerated.

# Subject (no prompt). 1024 px, ImageNet mean/std, NCHW f32 in (cast to fp16 inside the graph).
# IO: `input_image` f32 [1,3,1024,1024] -> `output_image` f32 [1,1,1024,1024] logits (apply a sigmoid).
[[model]]
name = "birefnet-lite"
title = "BiRefNet lite"
version = "fp16-de15b22"
task = "subject"
licence = "MIT"
licence_url = "https://github.com/ZhengPeng7/BiRefNet/blob/main/LICENSE"
homepage = "https://huggingface.co/onnx-community/BiRefNet_lite-ONNX"
input = [1, 3, 1024, 1024]
verified = true

[[model.files]]
path = "model_fp16.onnx"
url = "https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/de15b22ba131738a16dff04aab8bdf8dc32e3ac1/onnx/model_fp16.onnx"
bytes = 114538221
sha256 = "d39b897ceb16ae654c1731f3dba0cf9b368d9cae74b5a57459b455cc8bfec402"

# Subject, fast preview (Apache-2.0 U^2-Netp, 4.7 MB). BiRefNet lite does not compile in Core ML here (fp16 and fp32
# alike: a dilated `Conv` in `aspp_deforms` has no `pads`; checked 2026-10-10 on `onnx/model.onnx` and
# `onnx/model_fp16.onnx` of onnx-community/BiRefNet_lite-ONNX), so it runs on the CPU in 5.5-7 s; this one is for an
# instant, coarser mask. rembg's `u2netp.onnx` as published by BritishWerewolf/U-2-Netp (the same bytes as
# edgetools/u2netp and skillsafe-ai/u2netp). 320 px, ImageNet mean/std, NCHW f32.
# IO: `input.1` f32 [1,3,320,320] -> seven side outputs `1959` ... `1965` f32 [1,1,320,320], already sigmoided;
# `1959` is the fused one.
[[model]]
name = "u2netp"
title = "U2-Netp"
version = "fp32-7112208"
task = "subject-fast"
licence = "Apache-2.0"
licence_url = "https://github.com/xuebinqin/U-2-Net/blob/master/LICENSE"
homepage = "https://huggingface.co/BritishWerewolf/U-2-Netp"
input = [1, 3, 320, 320]
verified = true

[[model.files]]
path = "model.onnx"
url = "https://huggingface.co/BritishWerewolf/U-2-Netp/resolve/7112208dbac3a3642496c8d54e2f0f9bb3dc1dc8/onnx/model.onnx"
bytes = 4574861
sha256 = "309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8"

